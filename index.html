<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Scorebug for livestream</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700&family=Russo+One&display=swap" rel="stylesheet">
</head>
<body>

    <div class="main-container">
        
        <div class="scoreboard">
            
            <div class="teams-wrapper">
                
                <div class="team-row warriors" id="team-row-1">
                    <div class="logo-box">
                        <img id="team-img-1" src="" alt="Team 1">
                    </div>
                    <div class="score-box">
                        <div class="score" id="score-1">90</div>
                        <div class="timeouts" id="timeouts-1">
                            <span class="dash" id="t1-0"></span>
                            <span class="dash" id="t1-1"></span>
                            <span class="dash" id="t1-2"></span>
                        </div>
                    </div>
                </div>

                <div class="team-row bulls" id="team-row-2">
                    <div class="logo-box">
                        <img id="team-img-2" src="" alt="Team 2">
                    </div>
                    <div class="score-box">
                        <div class="score" id="score-2">79</div>
                        <div class="timeouts" id="timeouts-2">
                            <span class="dash" id="t2-0"></span>
                            <span class="dash" id="t2-1"></span>
                            <span class="dash active" id="t2-2"></span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="fouls-wrapper">
                <div class="foul-count" id="fouls-1">1</div>
                <div class="foul-label">FOULS</div>
                <div class="foul-count" id="fouls-2">0</div>
            </div>

            <div class="clock-wrapper">
                <div class="game-clock" id="game-clock-display">12:00</div>
                <div class="sub-clock">
                    <span class="period">4<span class="th">TH</span></span>
                    <span class="shot-clock" id="shot-clock">:12</span>
                </div>
            </div>
        </div>
<div class="controls">
    
    <div class="control-group">
        <h3>Top Team</h3>
        
        <div class="style-inputs">
            <input type="text" id="input-url-1" placeholder="Paste Logo URL">
            
            <label class="file-label">Upload Logo:</label>
            <input type="file" id="file-upload-1" accept="image/*" onchange="uploadLogo(1)">

            <div class="color-row">
                <input type="color" id="input-color-1" value="#1d428a">
                <button class="sm-btn" onclick="updateTeamStyle(1)">Set Color</button>
            </div>
        </div>
        <hr>

        <div class="label-row">POINTS</div>
        <div class="btn-grid">
            <button onclick="updateScore(1, 1)">+1</button>
            <button onclick="updateScore(1, 2)">+2</button>
            <button onclick="updateScore(1, 3)">+3</button>
            <button class="minus" onclick="updateScore(1, -1)">-1</button>
        </div>

        <div class="label-row">FOULS</div>
        <div class="row">
            <button class="minus" onclick="updateFouls(1, -1)">-</button>
            <button onclick="updateFouls(1, 1)">+</button>
        </div>

        <div class="label-row">TIMEOUTS</div>
        <div class="row">
            <button onclick="toggleTimeout(1, 0)">1</button>
            <button onclick="toggleTimeout(1, 1)">2</button>
            <button onclick="toggleTimeout(1, 2)">3</button>
        </div>
    </div>

    <div class="control-group clock-controls">
        <h3>Game Clock</h3>
        
        <div class="time-inputs">
            <input type="number" id="input-min" placeholder="12" value="12">
            <span>:</span>
            <input type="number" id="input-sec" placeholder="00" value="00">
            <button class="set-btn" onclick="setGameTime()">Set</button>
        </div>
        
        <button class="start-btn" id="btn-game-toggle" onclick="toggleGameClock()">Start Game</button>
        
        <hr>
        
        <h3>Shot Clock</h3>
        <div class="clock-display" id="shot-clock-display">24</div>
        
        <button class="start-btn" onclick="toggleShotClock()">Start / Stop</button>
        
        <div class="row">
            <button onclick="resetShotClock(24)">Reset 24</button>
            <button onclick="resetShotClock(14)">Reset 14</button>
        </div>
        
        <hr>

        <button class="stop-all" onclick="stopAllClocks()">STOP ALL CLOCKS</button>
        <button class="new-game-btn" onclick="resetNewGame()">NEW GAME (RESET)</button>
    </div>

    <div class="control-group">
        <h3>Bottom Team</h3>
        
        <div class="style-inputs">
            <input type="text" id="input-url-2" placeholder="Paste Logo URL">
            
            <label class="file-label">Upload Logo:</label>
            <input type="file" id="file-upload-2" accept="image/*" onchange="uploadLogo(2)">

            <div class="color-row">
                <input type="color" id="input-color-2" value="#ce1141">
                <button class="sm-btn" onclick="updateTeamStyle(2)">Set Color</button>
            </div>
        </div>
        <hr>

        <div class="label-row">POINTS</div>
        <div class="btn-grid">
            <button onclick="updateScore(2, 1)">+1</button>
            <button onclick="updateScore(2, 2)">+2</button>
            <button onclick="updateScore(2, 3)">+3</button>
            <button class="minus" onclick="updateScore(2, -1)">-1</button>
        </div>

        <div class="label-row">FOULS</div>
        <div class="row">
            <button class="minus" onclick="updateFouls(2, -1)">-</button>
            <button onclick="updateFouls(2, 1)">+</button>
        </div>

        <div class="label-row">TIMEOUTS</div>
        <div class="row">
            <button onclick="toggleTimeout(2, 0)">1</button>
            <button onclick="toggleTimeout(2, 1)">2</button>
            <button onclick="toggleTimeout(2, 2)">3</button>
        </div>
    </div>

</div>

    <script src="script.js"></script>
</body>
</html>
